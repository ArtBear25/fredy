[project]
name = "wohnungsbot-bewerbungsmodul"
version = "0.1.0"
description = "Lokales Bewerbungsmodul fuer Fredy mit Selenium-Workflow-Recorder"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44.0,<46",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "keyring>=25.6,<26",
  "python-multipart>=0.0.20,<1",
  "selenium>=4.29,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
bewerbungsmodul = "app.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

