<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bewerbungsmodul{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Bewerbungsmodul</a>
    <span class="local">Lokal · 127.0.0.1</span>
  </header>
  <main>
    {% if request.query_params.get('message') %}
      <div class="notice">{{ request.query_params.get('message') }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
