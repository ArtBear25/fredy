<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bewerbungsmodul{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Fredy Autobewerbung – Übersicht">
      <span class="brand-mark" aria-hidden="true">F</span>
      <span class="brand-copy"><strong>Fredy</strong><small>Autobewerbung</small></span>
    </a>
    <span class="local"><span class="status-dot" aria-hidden="true"></span>Lokal · 127.0.0.1</span>
  </header>
  <main>
    {% if request.query_params.get('message') %}
      <div class="notice">{{ request.query_params.get('message') }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
